---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app
  namespace: default
data:
  app.py: |
    import random, time
    from flask import Flask

    app = Flask(__name__)

    @app.route("/")
    def index():
        delay = random.uniform(0, 0.8)
        time.sleep(delay)
        if random.random() < 0.1:
            raise ValueError("simulated error")
        return f"ok (delay={delay:.2f}s)\n"

    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=5000)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      initContainers:
        - name: install
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              python3 -m venv /venv &&
              /venv/bin/pip install flask opentelemetry-distro opentelemetry-exporter-otlp-proto-grpc opentelemetry-instrumentation-flask -q &&
              /venv/bin/opentelemetry-bootstrap -a install
          volumeMounts:
            - name: pkgs
              mountPath: /venv
      containers:
        - name: demo
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - /venv/bin/opentelemetry-instrument /venv/bin/python /app/app.py
          env:
            - name: OTEL_SERVICE_NAME
              value: demo
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observability.svc:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: FLASK_ENV
              value: production
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: app
              mountPath: /app
            - name: pkgs
              mountPath: /venv
      volumes:
        - name: app
          configMap:
            name: demo-app
        - name: pkgs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: default
spec:
  selector:
    app: demo
  ports:
    - port: 5000
      targetPort: 5000
